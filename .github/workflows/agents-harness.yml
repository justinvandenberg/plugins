name: agents-harness

on:
  push:
    branches: [main]
    paths:
      - "agents-harness/**"
      - "pstack/**"
      - "cursor-team-kit/**"
      - ".github/workflows/agents-harness.yml"
  pull_request:
    paths:
      - "agents-harness/**"
      - "pstack/**"
      - "cursor-team-kit/**"
      - ".github/workflows/agents-harness.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Tests
        run: node --test agents-harness/
      - name: Generated tree is up to date
        run: node agents-harness/generate.mjs --check
