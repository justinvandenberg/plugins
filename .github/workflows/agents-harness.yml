name: agents-harness

on:
  push:
    branches: [main]
    paths:
      - "agents-harness/**"
      - "pstack/**"
      - "cursor-team-kit/**"
      - ".github/workflows/agents-harness.yml"
  pull_request:
    paths:
      - "agents-harness/**"
      - "pstack/**"
      - "cursor-team-kit/**"
      - ".github/workflows/agents-harness.yml"
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: "check or sync"
        type: choice
        options: [check, sync]
        default: check

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.job == 'check')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Tests
        run: node --test agents-harness/
      - name: Generated tree is up to date
        run: node agents-harness/generate.mjs --check

  sync:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.job == 'sync')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Merge upstream and regenerate
        id: sync
        run: |
          set -uo pipefail
          date=$(date -u +%Y-%m-%d)
          branch="justin/chore/sync-upstream-$date"
          log=$(mktemp)
          # Issues are off in this fork, so a failure goes to the job summary, and the failed run sends the
          # usual GitHub notification.
          fail() {
            {
              echo "## Upstream sync failed"
              echo
              echo "Step: \`$1\`"
              echo
              echo '```'
              tail -n 50 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cursor/plugins.git
          git fetch --no-tags upstream main > "$log" 2>&1 || fail "git fetch upstream main"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "No new upstream commits."
            exit 0
          fi
          git checkout -b "$branch"
          if ! git merge --no-edit upstream/main > "$log" 2>&1; then
            git merge --abort
            fail "git merge upstream/main (conflict)"
          fi
          node agents-harness/generate.mjs > "$log" 2>&1 || fail "node agents-harness/generate.mjs"
          git add agents-harness/skills
          git diff --cached --quiet || git commit -q -m "chore(agents-harness): regenerate after upstream sync $date"
          node --test agents-harness/ > "$log" 2>&1 || fail "node --test agents-harness/"
          node agents-harness/generate.mjs --check > "$log" 2>&1 || fail "node agents-harness/generate.mjs --check"
          if git diff --quiet origin/main HEAD; then
            echo "The merge changes nothing."
            exit 0
          fi
          git push --force -u origin "$branch" > "$log" 2>&1 || fail "git push"
          {
            echo "Merges cursor/plugins main into this fork and regenerates agents-harness/skills."
            echo
            echo "The sync job ran \`node --test agents-harness/\` and \`node agents-harness/generate.mjs --check\` on this branch, and both passed. A PR opened by the workflow token does not start other workflows, so the check job does not run here."
            echo
            echo "Changed generated skills:"
            echo
            echo '```'
            git diff --stat origin/main HEAD -- agents-harness/skills | tail -n 30
            echo '```'
          } > body.md
          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "A PR for $branch is already open; the push updated it."
          elif ! gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "chore: sync upstream cursor/plugins $date" --body-file body.md > "$log" 2>&1; then
            {
              echo "## Upstream sync is ready, but the PR was not created"
              echo
              echo "The branch passed the checks and was pushed. Open the PR from: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch"
              echo
              echo "To let this job open the PR, turn on Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
              echo
              echo '```'
              tail -n 20 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
